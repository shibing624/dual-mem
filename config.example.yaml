# dual-mem 配置示例
# 复制到 ~/.dual_mem/config.yaml 后按需修改。
# 也可用 DUAL_MEM_CONFIG_FILE 环境变量指定其它路径。
# 字段同名环境变量（DUAL_MEM_ 前缀）可临时覆盖本文件。

# 运行档位：lite | pro | ultra
mode: pro

# 向量/图/KV 数据落盘目录
storage_dir: ./.dual_mem_data

# LLM（抽取 / 整理 / System2）
llm_base_url: https://api.openai.com/v1
llm_api_key: sk-your-llm-key
llm_model: gpt-4o-mini
# 用 OpenAI JSON mode（response_format=json_object）让返回 JSON 更稳、省重试。
# 仅当所用 endpoint 不支持 response_format 时才设为 false。
llm_json_mode: true

# Embedding
embed_base_url: https://api.openai.com/v1
embed_api_key: sk-your-embed-key
embed_model: text-embedding-3-small
embed_dim: 1536

# 鉴权（REST）
auth_disabled: true
app_whitelist:
  - default

# System2 触发：per_write | manual | scheduled
system2_trigger_mode: per_write

# System2 聚类相似度阈值（cosine）。默认适配 text-embedding-3-small；
# 换用相似度更集中的中文 embedding（bge/Qwen 等）可调高到 0.55 / 0.75。
cluster_stage1_sim: 0.42
cluster_stage2_sim: 0.55

# Reconciler 额外的 LLM 召回查询改写：默认关闭，语义召回已够用，每次写入省一次 LLM。
reconcile_search_query: false

# System2 用多轮 ops 循环（更强的取证/反思，但更慢更贵）；默认单轮即可。
system2_agent_loop: false
system2_loop_max_iters: 3
