[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-mem"
version = "0.1.2"
description = "Dual-system layered memory SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.30",
    "chromadb>=0.5",
    "kuzu>=0.4",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# REST API (`dual-mem serve`, `from dual_mem.api import create_app`)
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# CLI (`dual-mem add|search|...`)
cli = [
    "typer>=0.12",
]
# MCP server (`dual-mem-mcp`, `dual-mem mcp`)
mcp = [
    "mcp>=1.2",
]
# All optional frontends
all = [
    "dual-mem[api,cli,mcp]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "dual-mem[all]",
]

[project.scripts]
dual-mem = "dual_mem.cli.main:app"
dual-mem-mcp = "dual_mem.mcp.server:main"

[tool.setuptools.packages.find]
include = ["dual_mem*"]

[tool.setuptools.package-data]
dual_mem = ["config.default.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "benchmark: opt-in recall regression harness; skipped by default. Run with `pytest -m benchmark`.",
]
