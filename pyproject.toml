[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-mem"
version = "0.2.0"
description = "Dual-system layered memory SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.30",
    "httpx>=0.27",
    "chromadb>=1.0",
    "kuzu>=0.4",
    "numpy>=1.26",
    # System 2 digest clusters facts with average-linkage (dual mode).
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# REST API (`dual-mem serve`, `from dual_mem.api import create_app`)
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# CLI (`dual-mem add|search|...`)
cli = [
    "typer>=0.12",
]
# MCP server (`dual-mem-mcp`, `dual-mem mcp`)
mcp = [
    "mcp>=1.2,<2",
]
# agentica integration (`dual_mem.integrations.agentica`)
agentica = [
    "agentica",
]
# Tests import `agentica.workspace` to verify the adapter forwards every native method.
# Without this extra those tests can only fail (or silently skip) on a clean checkout.
test = [
    "agentica",
]
# All optional frontends
all = [
    "dual-mem[api,cli,mcp]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "dual-mem[all,test]",
]

[project.scripts]
dual-mem = "dual_mem.cli.main:app"
dual-mem-mcp = "dual_mem.mcp.server:main"
dual-mem-hook = "dual_mem.integrations.claude_code:main"

[tool.setuptools.packages.find]
include = ["dual_mem*"]

[tool.setuptools.package-data]
dual_mem = ["config.default.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "benchmark: opt-in recall regression harness; skipped by default. Run with `pytest -m benchmark`.",
]
