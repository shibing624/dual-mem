[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-mem"
version = "0.1.0"
description = "Dual-system layered memory SDK (Hy-Memory reproduction)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.30",
    "chromadb>=0.5",
    "kuzu>=0.4",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
dual-mem = "dual_mem.cli.main:app"

[tool.setuptools.packages.find]
include = ["dual_mem*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
