# ============================================================================
# dual-mem 配置模板
# 首次构造 MemoryClient 时，若 ~/.dual_mem/config.yaml 不存在会自动复制本文件。
#
# 配置优先级（高 → 低）：
#   1. MemoryClient(...) / Settings(...) 显式传参
#   2. 环境变量 DUAL_MEM_*（字段名转大写，如 llm_api_key → DUAL_MEM_LLM_API_KEY）
#   3. YAML 文件（本文件；路径可用 DUAL_MEM_CONFIG_FILE 覆盖）
#   4. preset 预设档位（见下方 “preset”，只填你没显式设置的字段）
#   5. 代码内默认值
#
# 新手只需改下面【必填】这一段就能跑起来，其余全部可不动（留空即用默认值）。
# ============================================================================

# ============================================================================
# 【必填】改完这几项即可运行
# ============================================================================

# --- LLM（Gate / Extract / Reconcile / Summarize 用）---
llm_api_key: ""                       # 必填；或设环境变量 DUAL_MEM_LLM_API_KEY
llm_base_url: https://api.openai.com/v1
llm_model: gpt-4o-mini

# --- Embedding（向量检索锚点）---
embed_api_key: ""                     # 必填；或设环境变量 DUAL_MEM_EMBED_API_KEY
embed_base_url: https://api.openai.com/v1
embed_model: text-embedding-3-small
embed_dim: 1536                       # 须与 embed 模型输出维度一致（bge-m3→1024，3-small→1536）

# --- 运行模式与存储 ---
# system1：同步 System1（Gate → Extract → 快写 L0–L4），秒级可用
# dual   ：System1 + 异步 System2（图 / L6 schema / L7 intention）
mode: system1
storage_dir: ./.dual_mem_data        # 数据目录（Chroma / SQLite / Kuzu 均在此下）

# ============================================================================
# 【档位】preset —— 一键套用一组“召回 vs 紧凑”调优，免去手调下面几个旋钮
#   default     —— 均衡：合并/演化事实 → 记忆库紧凑 + 演化链（通用 SDK 首选）
#   high_recall —— 高召回：永不合并/删除事实，每条都留（计数 / 审计 / 评测）
# 注：写入延迟是“正交”维度，不做成 preset；想要低延迟就在下方高级区单独打开
#     combined_gate_extract 和 embed_merge_l1_gate 两个开关。
# preset 只会填你没有显式设置的字段；本文件 / env / 传参里写的值始终覆盖 preset。
# ============================================================================
preset: default

# ============================================================================
# 【高级】以下全部为可选调优项，默认值已写在注释里。
# 不懂就别动；要改时取消该行注释即可（其值会覆盖 preset 与代码默认值）。
# ============================================================================

# --- LLM 进阶 ---
# llm_json_mode: true                 # OpenAI JSON mode；部分自建端点需设 false
# extra_body: {}                       # 厂商扩展 body，如 {"thinking": {"type": "disabled"}}
# extra_headers: {}                    # 厂商扩展 headers，如内部平台认证/ tracing
# llm_timeout: 60
# llm_context_window: 32768           # 模型最大 context（tokens）；超长 prompt 分块 merge 而非截断
# llm_completion_reserve: 4096        # 从 context_window 预留给 completion 的 token
# chars_per_token: 2.5                # token→字符估算系数（LLM 与 embed 分块共用）

# --- Embedding 进阶 ---
# embed_timeout: 30
# embed_max_tokens: 8000              # 单次 embed 最大 input tokens；更长文本切分 + 均值池化
# embed_retry_attempts: 3
# embed_retry_base_delay: 0.5

# --- REST 鉴权（仅 dual-mem serve 时生效）---
# auth_disabled: true                 # true：跳过 Bearer / appkey 校验（本地开发）
# app_whitelist:                      # 允许的 app_id（逗号分隔字符串或 YAML 列表）
#   - default
# default_app_id: default             # add/list/search 未传 app_id 时的默认租户

# --- System2 异步管线（仅 mode=dual）---
# system2_trigger_mode: per_write     # per_write / manual（client.digest() 触发）/ scheduled
# system2_schedule_interval_sec: 300  # scheduled 模式的循环间隔（秒）
# reconcile_sync: false               # true：写入路径同步 Reconcile（强一致，延迟 +1 次 LLM）
# system2_max_iters: 6                # ReAct 最大轮数（仅残余 ReAct 路径用）
# system2_single_shot_max_clusters: 1 # single-shot 门槛：簇数 ≤ 此值
# system2_single_shot_max_facts: 80   # single-shot 门槛：总事实数 ≤ 此值
# reconcile_search_query: false       # Reconciler 是否额外生成搜索 query（默认关，省一次 LLM）
# reconcile_policy: balanced          # balanced（允许跨节点合并，更紧凑）/ conservative（禁合并，高召回）
# reconcile_non_destructive: false    # true：S2 只增量、永不 supersede/DELETE 原始 fact（计数零丢失）→ preset high_recall
# reconcile_skip_llm: false           # true：排空队列不调 reconcile LLM（配合 non_destructive）→ preset high_recall
# reconcile_weak_candidate_score: 0.5 # 最强候选相似度低于此值时跳过 LLM 直接 SUPPLEMENT；0=关闭
# reconcile_concurrency: 1            # reconcile 队列并发度（1=串行；>1 多 task 并发 recall+LLM）
# cluster_stage1_sim: 0.42            # System2 两阶段聚类 cosine 阈值
# cluster_stage2_sim: 0.55

# --- Attentional Gate（写入前过滤低价值内容）---
# gate_enabled: true
# gate_threshold: 0.3
# combined_gate_extract: false        # true：Gate+Extract 合一，每 turn 省 1 次 RTT（低延迟，可单独开）
# gate_heuristic_shortcircuit: true   # 高 novelty + 高 relevance 时跳过 Gate LLM
# gate_shortcircuit_novelty: 0.8
# gate_shortcircuit_relevance: 0.5
# gate_shortcircuit_reject_novelty: 0.12  # 高度重复且无传记相关性直接 REJECT；0=关闭
# content_hash_dedup: true            # 同 scope 重复 content 跳过 extract
# content_hash_scope: session         # session（严格）/ user（跨会话，命中率更高）

# --- Extract / Summarize ---
# summarizer_enabled: true
# summarizer_min_content_tokens: 600  # L3 摘要触发阈值（token）
# extract_max_content_tokens: 0       # Extract 输入硬上限（token，0=不截断走分块 merge）；benchmark 可设 4000
# extract_retry_on_failure: true
# extract_few_shot_enabled: true      # extract prompt 末尾追加 few-shot 示例（引导小模型稳定格式）
# extract_history_turns: 20           # extract 时传最近 N 轮 L1_RAW 做共指消解；0=关闭
# extract_history_context_ratio: 0.7  # 对话超此 context 比例时仅截断 assistant 轮，user 轮全保留
# extract_assistant_max_tokens: 512

# --- 读路径 ---
# reader_mode: hybrid                 # hybrid（语义召回 + 池内 BM25 重排 + 图证据融合）/ legacy
# hybrid_w_sem: 0.6                    # hybrid 融合权重：语义
# hybrid_w_bm25: 0.4                   # hybrid 融合权重：池内 BM25 重排
# hybrid_evidence_boost_max: 0.3       # 图 L6 证据加成上限
# hybrid_evidence_saturate: 5          # 证据加成饱和计数
# reader_suppress_derived_on_factual: false  # true：FACTUAL/NAVIGATIONAL 查询不返回 L6/L7，top-k 全给原始事实 → preset high_recall
# reconsolidation_enabled: true        # 读侧 reconsolidation（access bump + co-recall 边）
# reconsolidation_min_interval_sec: 0  # 0=每次 search 都跑；>0=同 user 最小间隔（秒）

# --- Coding/tool-use memory（工程对话独立链路）---
# coding_enabled: false                 # opt-in；开启后 add() 先检测 tool 消息，coding 走独立 store
# coding_db_path: ""                    # 空=自动 {storage_dir}/coding_memory.db
# coding_tool_result_max_bytes: 2048    # tool_result 截断字节上限

# --- Embed 写入侧攒批（不影响 search 侧直接 embed）---
# embed_queue_batch_size: 32
# embed_queue_window_ms: 200.0
# embed_cache_size: 10000
# embed_merge_l1_gate: false          # true：L1 对话 + Gate user 轮合并为一次 embed（低延迟，可单独开）

# --- Cross-domain Sweeper（默认关；将多个 base schema 归纳为核心 schema）---
# cross_domain_enable: false
# cross_domain_min_basics: 5
# cross_domain_threshold: 0.7

# --- 其它 ---
# persist_history: false              # 写入审计 history.db（读路径不用；默认关）
# purge_done_queues: true             # digest 后删除已完成队列行，防止 cache.db 膨胀