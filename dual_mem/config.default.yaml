# 配置优先级：显式参数 > DUAL_MEM_* 环境变量 > YAML > preset > 默认值。
# 密钥建议只放环境变量；不把本地配置提交到 git。
mode: system1
storage_dir: ./.dual_mem_v4
preset: default

# JEV：全部语义判断。Venus 仅替换 endpoint，model 显式发送。
jev_api_key: ""
jev_endpoint: https://api.typesafe.ai/v1/systemone
jev_model: jev-1.13.0
# Venus: http://v2.open.venus.oa.com/llmproxy/v1/systemone
reconcile_concurrency: 4
reconcile_candidate_limit: 64
reconcile_batch_size: 12
reconcile_retry_attempts: 3
# 低于该置信度的关系先按 SUPPLEMENT 独立写入，digest() 复核；0 = 关闭置信度路由。
# NEED_CONTEXT / 多目标 UNSURE 总是延后复核，不会让写入失败。
reconcile_review_confidence: 0.0
# coverage 被拒或漏抽时带反馈重抽的次数；用尽后仍提交候选并把来源排队复核。
extract_coverage_retries: 1
review_max_attempts: 3
s2_max_attempts: 3
request_outcome_ttl_seconds: 604800
jev_max_questions: 64
jev_max_request_chars: 100000
jev_max_question_chars: 60000
jev_timeout: 30
jev_retry_attempts: 3

# 生成模型：候选文本、MERGE 文本、System2 推导；不负责关系裁决。
llm_api_key: ""
llm_base_url: https://api.openai.com/v1
llm_model: gpt-4o-mini
# llm_context_window: 32768
# llm_completion_reserve: 4096

# Embedding：索引与读侧检索；不作写入信用或相似度路由。
embed_api_key: ""
embed_base_url: https://api.openai.com/v1
embed_model: text-embedding-3-small
embed_dim: 1536

# dual 的显式 digest；按真实 evidence IDs 分页，不靠 cluster 丢弃材料。
system2_max_prompt_facts: 120
write_serialize_per_user: false
persist_history: false
purge_done_queues: true
# 版本日志 versions.db 始终持久化，persist_history 仅控制附加 history.db 审计。
# high_recall 只扩大材料预算，不跳过 JEV，也不改变关系语义。
